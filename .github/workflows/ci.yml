name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Core tests
        run: dotnet test UnoCockpit.Core.Tests -c Release
      - name: Build WebAssembly
        run: dotnet build UnoCockpit/UnoCockpit.csproj -f net10.0-browserwasm -c Release
